[project]
name = "yt-curator"
version = "0.1.0"
description = "YouTube playlist curation engine — inventory, deduplicate, merge, clean, and reorganise 20 years of playlists"
authors = [
    {name = "Danny Poulson", email = "danny@telos.systems"}
]
license = {text = "MIT OR Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "click>=8.1",
    "rich>=13.7",
    "mcp>=1.27,<2",
    "httpx>=0.27",
    "orjson>=3.9",
]

[project.urls]
"Homepage" = "https://github.com/telos-systems/yt-curator"
"Repository" = "https://github.com/telos-systems/yt-curator"
"Documentation" = "https://github.com/telos-systems/yt-curator#readme"

[project.scripts]
yt-curator = "yt_curator.cli.app:cli"
yt-curator-mcp = "yt_curator.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_curator"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = ["I"]  # isort

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
